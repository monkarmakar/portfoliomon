<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff006e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7209b7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0a0a0f" stroke="url(#grad)" stroke-width="2" filter="url(#glow)"/>
  <!-- MK text -->
  <text x="50" y="62" font-family="Orbitron, sans-serif" font-size="36" font-weight="900" fill="url(#grad)" text-anchor="middle" filter="url(#glow)">MK</text>
  <!-- FX subscript -->
  <text x="75" y="72" font-family="Orbitron, sans-serif" font-size="14" font-weight="700" fill="#ff006e" text-anchor="middle">FX</text>
  <!-- Decorative elements -->
  <path d="M20 30 L35 25 L30 40 Z" fill="#00ff88" opacity="0.8"/>
  <path d="M80 30 L65 25 L70 40 Z" fill="#ff006e" opacity="0.8"/>
  <path d="M20 70 L35 75 L30 60 Z" fill="#7209b7" opacity="0.8"/>
  <path d="M80 70 L65 75 L70 60 Z" fill="#00ff88" opacity="0.8"/>
</svg>